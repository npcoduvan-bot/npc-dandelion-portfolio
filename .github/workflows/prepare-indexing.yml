name: Verify published indexing
on:
  push:
    branches: [fix/indexing-20261116]
    paths:
      - '.github/workflows/prepare-indexing.yml'
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check live HTTPS endpoints and all published routes
        shell: python
        run: |
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          site = 'https://npc-dandelion-portfolio.pages.dev'
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'NPC-Dandelion-indexing-check/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  assert response.status == 200, (url, response.status)
                  assert response.url.startswith(site + '/'), response.url
                  assert 'noindex' not in response.headers.get('X-Robots-Tag', '').lower(), url
                  return response.read().decode('utf-8')
          for attempt in range(18):
              try:
                  robots = get(site + '/robots.txt')
                  assert robots == f'User-agent: *\nAllow: /\n\nSitemap: {site}/sitemap-index.xml\n', robots[:300]
                  index = ET.fromstring(get(site + '/sitemap-index.xml'))
                  maps = [n.text for n in index.findall('s:sitemap/s:loc', ns)]
                  assert maps and all(u.startswith(site + '/sitemap-') for u in maps)
                  urls = []
                  for u in maps:
                      urls += [n.text for n in ET.fromstring(get(u)).findall('s:url/s:loc', ns)]
                  expected = {site + '/' if p.name == 'index.astro' else site + '/' + p.relative_to('src/pages').with_suffix('').as_posix() + '/' for p in Path('src/pages').rglob('*.astro')}
                  assert set(urls) == expected, (urls, expected)
                  assert len(urls) == 9
                  with ThreadPoolExecutor(max_workers=4) as pool:
                      pages = list(pool.map(get, urls))
                  print('PASS: HTTPS 200 for robots, sitemap index, sitemap files and all 9 pages.')
                  print(robots)
                  print('\n'.join(sorted(urls)))
                  break
              except Exception as error:
                  print(f'Attempt {attempt + 1}: {error}', flush=True)
                  if attempt == 17:
                      raise
                  time.sleep(10)
