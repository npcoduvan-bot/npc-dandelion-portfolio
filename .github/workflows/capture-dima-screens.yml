name: Capture Dima portfolio screenshots
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-dima-screens.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          mkdir -p /tmp/dima-shot
          cd /tmp/dima-shot
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Capture actual published site
        run: |
          mkdir -p public/assets/dima/screens
          cat > /tmp/dima-shot/capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = 'https://dima-ne-na-zakaz.npcoduvan.chatgpt.site/';
          (async () => {
            const browser = await chromium.launch({headless:true, args:['--no-sandbox']});
            const items = [
              { name:'home-desktop', hash:'', width:1440, height:960, mobile:false },
              { name:'archive-desktop', hash:'#archive', width:1440, height:980, mobile:false },
              { name:'about-desktop', hash:'#about', width:1440, height:960, mobile:false },
              { name:'home-mobile', hash:'', width:390, height:844, mobile:true }
            ];
            let completed=0;
            for (const item of items) {
              const page = await browser.newPage({viewport:{width:item.width,height:item.height}, deviceScaleFactor:1, isMobile:item.mobile, hasTouch:item.mobile});
              try {
                await page.goto(base, {waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(2300);
                const body = (await page.locator('body').innerText({timeout:15000})).toUpperCase();
                if (!body.includes('НЕ НА ЗАКАЗ') || body.length<150) throw new Error('Target site did not render expected text ('+body.slice(0,140)+')');
                if(item.hash){
                  const target=await page.locator(item.hash).count();
                  if(target){await page.locator(item.hash).scrollIntoViewIfNeeded();await page.waitForTimeout(1300);}
                }
                await page.evaluate(async()=>{await document.fonts.ready; const imgs=[...document.images].filter(i=>{const r=i.getBoundingClientRect();return r.bottom>0&&r.top<window.innerHeight});await Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise(resolve=>{i.addEventListener('load',resolve,{once:true});i.addEventListener('error',resolve,{once:true});setTimeout(resolve,4000)})));});
                await page.screenshot({path:'public/assets/dima/screens/'+item.name+'.png',animations:'disabled'});
                completed++;
                console.log('CAPTURED', item.name, await page.title());
              }catch(e){console.error('FAILED',item.name,String(e));}
              finally{await page.close();}
            }
            await browser.close();
            if(completed<3)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          NODE_PATH=/tmp/dima-shot/node_modules node /tmp/dima-shot/capture.cjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/dima/screens/*.png
          if ! git diff --staged --quiet; then git commit -m "Capture authentic Dima site screenshots"; git push; fi
