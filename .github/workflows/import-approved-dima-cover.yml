name: Import user-approved Dima cover
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-approved-dima-cover.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download exact approved image without transformation
        run: |
          mkdir -p public/assets/dima
          cat > /tmp/import-approved-dima.py <<'PY'
          import hashlib
          import urllib.request
          from pathlib import Path
          file_id='1i9o-aR7PJLFgOJDDRouLUH1ytXWFZJp1'
          expected='f0911fe8dc7c78b3d90aaca4f131c38804ba7a1be65f6e5c26f12012cf10dc26'
          urls=[
            f'https://drive.google.com/uc?export=download&id={file_id}',
            f'https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t'
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=40) as res:
                data=res.read()
              sha=hashlib.sha256(data).hexdigest()
              print('Downloaded',len(data),'bytes, sha256',sha)
              if sha==expected:
                output=Path('public/assets/dima/dima-approved-cover.jpg')
                output.write_bytes(data)
                print('OK: exact, unmodified user image:', output)
                break
            except Exception as exc:
              print('Attempt failed:',str(exc))
          else:
            raise SystemExit('Could not download verified source file. Refusing to substitute or modify.')
          PY
          python /tmp/import-approved-dima.py
      - name: Commit approved image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/dima/dima-approved-cover.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add exact approved Dima cover without edits"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
