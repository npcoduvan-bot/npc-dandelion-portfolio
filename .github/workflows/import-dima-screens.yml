name: Import verified Dima screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/import-dima-screens.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch screenshots from user's shared source folder
        run: |
          mkdir -p public/assets/dima/screens
          cat > /tmp/fetch-dima.py <<'PY'
          import urllib.request
          from pathlib import Path
          ids={
          "home":"1PcFw9gjw_mTgj95iKRi5DzyPwC4aUwlb",
          "gallery-intro":"1bD-IUOCFy1fl1__RlsoPqM4vurp4ZHUI",
          "gallery-grid":"1NZxrlOJ-OVIneUYET0NGYpSQoqoL8U0h",
          "about":"1HhIaA-VGQn43BKkGDWLhu3g-HtLmEm8F",
          }
          output=Path("public/assets/dima/screens")
          for name, fid in ids.items():
              candidates=[
                "https://drive.google.com/uc?export=download&id="+fid,
                "https://drive.usercontent.google.com/download?id="+fid+"&export=download&confirm=t",
              ]
              data=None
              for url in candidates:
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req,timeout=35) as res:
                          candidate=res.read()
                          print(name, res.status, res.headers.get('content-type'),len(candidate))
                          if candidate.startswith(b'RIFF') and candidate[8:12]==b'WEBP':
                              data=candidate;break
                  except Exception as exc:
                      print(name,'attempt failed',str(exc)[:250])
              if data is None:
                  raise RuntimeError("Could not get public WebP screenshot "+name)
              (output/(name+".webp")).write_bytes(data)
          PY
          python /tmp/fetch-dima.py
      - name: Commit real screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/dima/screens
          if ! git diff --cached --quiet; then
            git commit -m "Add real authenticated Dima website screenshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
