name: Verify portfolio build
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-portfolio-build.yml
      - src/pages/projects/dima-ne-na-zakaz.astro
      - src/styles/dima-case.css
      - src/components/ProjectCover.astro
      - src/styles/project-covers.css
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Check rendered Dima case page
        run: |
          test -f dist/projects/dima-ne-na-zakaz/index.html
          grep -q 'Никаких' dist/projects/dima-ne-na-zakaz/index.html
          grep -q 'dima-real-screens' dist/projects/dima-ne-na-zakaz/index.html
          grep -q 'gallery-grid.webp' dist/projects/dima-ne-na-zakaz/index.html
          test -s public/assets/dima/screens/home.webp
          test -s public/assets/dima/screens/gallery-intro.webp
          test -s public/assets/dima/screens/gallery-grid.webp
          test -s public/assets/dima/screens/about.webp
          if grep -q 'dima-static-preview' dist/projects/dima-ne-na-zakaz/index.html; then echo 'Outdated faux-screen preview still exists' && exit 1; fi
